
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certified Pre-Owned Inventory | Cars And Stripes Forever</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--navy:#00538e;--navy-deep:#003d68;--red:#c41f0a;--red-deep:#8e0e0f;--lime:#8fd400;--lime-deep:#6a9e00;--line:#dde1e6;--muted:#5b6470;--black:#0a0a0a;}
  *{box-sizing:border-box;}
  body{margin:0;background:#f4f5f7;font-family:'Inter',system-ui,sans-serif;color:#10151b;}
  h1,h2,.display{font-family:'Oswald';text-transform:uppercase;letter-spacing:0.02em;margin:0;}
  header{background:var(--black);color:#fff;padding:18px 20px;border-bottom:3px solid var(--red);}
  header .name{font-family:'Oswald';font-weight:700;font-size:18px;}
  header .tag{font-size:11px;color:#9aa5b1;margin-top:2px;}
  .wrap{max-width:900px;margin:0 auto;padding:28px 20px 60px;}
  .head{margin-bottom:22px;}
  .head h1{font-size:24px;color:var(--navy-deep);}
  .head p{color:var(--muted);font-size:13.5px;margin-top:6px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;display:block;}
  .art{height:130px;background:#ffffff;border-bottom:1px solid var(--line);position:relative;display:flex;align-items:center;justify-content:center;}
  .art img{max-width:90%;max-height:90%;object-fit:contain;}
  .ribbon{position:absolute;top:10px;left:10px;background:var(--lime);color:var(--lime-deep);font-size:10px;font-weight:700;letter-spacing:0.04em;padding:4px 9px;border-radius:999px;}
  .ribbon.sold{background:var(--red);color:#fff;}
  .body{padding:14px 16px 18px;}
  .body h3{font-size:15px;margin-bottom:3px;}
  .dealer{font-size:12px;color:var(--muted);margin-bottom:8px;}
  .price-row{display:flex;justify-content:space-between;align-items:baseline;}
  .price{font-family:'IBM Plex Mono';font-weight:600;font-size:18px;color:var(--red-deep);}
  .miles{font-size:12px;color:var(--muted);}
  .stock{font-family:'IBM Plex Mono';font-size:10.5px;color:#9aa1a9;margin-top:6px;}
  footer{text-align:center;padding:20px;font-size:11px;color:#9aa1a9;}
</style>
</head>
<body>
  <header>
    <div class="name">Cars And Stripes Forever Inc.</div>
    <div class="tag">Sample inventory &mdash; demo build</div>
  </header>

  <div class="wrap">
    <div class="head">
      <h1>Certified Pre-Owned Inventory</h1>
      <p>Sample listing showing how each vehicle's decal QR code leads here &mdash; open any car, then try the demo control panel to see what happens when one sells.</p>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <footer>Demo build for internal review &middot; <a href="admin.html" style="color:#9aa1a9;">Demo control panel</a></footer>

<script>
  const VEHICLES = [
    { code:'SZ24187', name:'2022 Subaru Outback Limited', dealer:'Zeigler Subaru of Schererville', price:'$28,995', miles:'34,200 mi', page:'vehicle-sz24187.html', photo:'vehicle-sz24187.jpg' },
    { code:'NC24198', name:'2021 Cadillac XT5 Premium Luxury', dealer:'Napleton Cadillac Oaklawn', price:'$32,450', miles:'28,600 mi', page:'vehicle-nc24198.html', photo:'vehicle-nc24198.jpg' },
    { code:'AC24501', name:'2023 Chevrolet Equinox LT', dealer:'Advantage Chevrolet Hodgkins', price:'$24,780', miles:'19,900 mi', page:'vehicle-ac24501.html', photo:'vehicle-ac24501.jpg' },
  ];

  function keyFor(code){ return 'csf_demo_sold_' + code; }
  function priceKeyFor(code){ return 'csf_price_' + code; }

  const grid = document.getElementById('grid');
  VEHICLES.forEach(v => {
    const isSold = localStorage.getItem(keyFor(v.code)) === 'true';
    const priceOverride = localStorage.getItem(priceKeyFor(v.code));
    const displayPrice = priceOverride ? '$' + parseInt(priceOverride, 10).toLocaleString() : v.price;
    const a = document.createElement('a');
    a.className = 'card';
    a.href = isSold ? 'sold.html' : v.page;
    a.innerHTML = `
      <div class="art"><img src="${v.photo}" alt="${v.name}"><span class="ribbon ${isSold ? 'sold' : ''}">${isSold ? 'SOLD' : 'CERTIFIED PRE-OWNED'}</span></div>
      <div class="body">
        <h3>${v.name}</h3>
        <div class="dealer">${v.dealer}</div>
        <div class="price-row"><span class="price">${displayPrice}</span><span class="miles">${v.miles}</span></div>
        <div class="stock">Stock #${v.code}</div>
      </div>
    `;
    grid.appendChild(a);
  });
</script>
</body>
</html>
